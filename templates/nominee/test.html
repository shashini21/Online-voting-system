<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Test Dashboard</h3>
          </div>
          <div class="card-body">
            <div class="alert alert-success" role="alert">
              <h4 class="alert-heading">Success!</h4>
              <p th:text="${message}">Test message</p>
              <hr>
              <p class="mb-0">If you can see this page, the controller is working correctly.</p>
            </div>
            <div class="mt-3">
              <a href="/nominee/dashboard" class="btn btn-primary">Go to Nominee Dashboard</a>
              <a href="/" class="btn btn-secondary">Go Home</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
